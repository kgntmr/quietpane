# Builds and tests Quietpane from source on pushes to main, pull requests targeting main, and manual runs.
#
# Windows PowerShell 5.1 on purpose: that is what Quietpane targets and what people actually run it
# with, so testing under PowerShell 7 would be testing something else.
#
# Four of the checks start a real WPF window (Quietpane.ps1 -SelfTest, in STA, without showing it).
# They run here like any other check. If a hosted runner ever cannot do that, those checks FAIL and
# this workflow goes red - which is the point. Narrowing the suite to make the badge green again,
# while the documentation still quotes the full-suite result, would quietly change what "tests pass" means.
# Whatever CI actually runs is the number the README and CONTRIBUTING quote.

name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact branch, tag or commit to check and build
        required: false
        type: string

permissions:
  contents: read

jobs:
  windows:
    name: Checks and build
    runs-on: windows-latest

    steps:
      - name: Get the source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      # Git is told not to touch line endings in these files (.gitattributes marks them -text), so
      # what is in the repository is exactly what lands on someone's PC. CONTRIBUTING.md asks
      # contributors for CRLF and pure ASCII; this is what makes that true rather than hopeful.
      - name: Line endings and plain ASCII
        shell: powershell
        run: |
          $bad = @()
          $files = @(Get-ChildItem -Path . -Recurse -File -ErrorAction Stop |
              Where-Object { $_.Extension -in '.ps1', '.psm1', '.psd1', '.cmd' -and $_.FullName -notmatch '\\dist\\' })
          # A check that finds nothing must not pass. If the walk is ever cut short - a path too long,
          # a permission - the honest outcome is a failure, not "0 files, all fine".
          if ($files.Count -lt 10) {
              Write-Host ("Only {0} script files found; this repository has more than that." -f $files.Count) -ForegroundColor Red
              Write-Host "The check did not really run, so it cannot be said to have passed."
              exit 1
          }
          foreach ($f in $files) {
              $bytes = [IO.File]::ReadAllBytes($f.FullName)
              $nonAscii = 0; $loneLf = 0
              for ($i = 0; $i -lt $bytes.Length; $i++) {
                  $b = $bytes[$i]
                  if ($b -eq 0x0A) {
                      if ($i -eq 0 -or $bytes[$i - 1] -ne 0x0D) { $loneLf++ }
                      continue
                  }
                  if ($b -eq 0x0D -or $b -eq 0x09) { continue }
                  if ($b -lt 0x20 -or $b -gt 0x7E) { $nonAscii++ }
              }
              if ($nonAscii -or $loneLf) {
                  $bad += [pscustomobject]@{
                      File = Resolve-Path -Relative $f.FullName
                      NonAscii = $nonAscii
                      LoneLF = $loneLf
                  }
              }
          }
          if ($bad.Count) {
              Write-Host "These files are not plain ASCII with CRLF endings:`n" -ForegroundColor Red
              $bad | Format-Table -AutoSize | Out-String | Write-Host
              Write-Host "NonAscii counts bytes outside 32-126 (plus tab). LoneLF counts newlines with no carriage return."
              Write-Host "See the 'Line endings and plain ASCII' section of CONTRIBUTING.md."
              exit 1
          }
          Write-Host ("{0} script files checked: all plain ASCII with CRLF endings." -f $files.Count) -ForegroundColor Green

      - name: Run the checks
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests\Run-QuietpaneTests.ps1

      - name: Build the download
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools\build-release.ps1

      # tools\build-release.ps1 fixes entry order and metadata, then rebuilds after deliberately
      # changing staged file timestamps. A hash mismatch fails the build. Listing the per-file hashes
      # here also makes the contents independently inspectable.
      - name: Hash what went into it
        shell: powershell
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead((Resolve-Path 'dist\Quietpane.zip'))
          try {
              $zip.Entries | Sort-Object FullName | ForEach-Object {
                  $s = $_.Open()
                  try {
                      $hash = (Get-FileHash -InputStream $s -Algorithm SHA256).Hash
                  } finally { $s.Dispose() }
                  '{0}  {1}' -f $hash, $_.FullName
              }
          } finally { $zip.Dispose() }
          Write-Host ("`nZIP itself: {0}" -f (Get-FileHash 'dist\Quietpane.zip' -Algorithm SHA256).Hash)

      - name: Keep the build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Quietpane-zip
          path: |
            dist/Quietpane.zip
            dist/Quietpane.zip.sha256
          if-no-files-found: error
